name: partpilot
services:
  partpilot:
    build: .
    environment:
      LLM_MODE: ${LLM_MODE:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      PARTPILOT_INIT_PASSWORD: ${PARTPILOT_INIT_PASSWORD:-}
      PARTPILOT_PASSWORD: ${PARTPILOT_PASSWORD:-}
      PARTPILOT_RAW_DIR: data/sample
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      - partpilot-state:/app/data/state
volumes:
  partpilot-state:
